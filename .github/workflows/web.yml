name: Build Flutter Web to /docs

on:
  push:
    branches:
      - preview-web
  workflow_dispatch: # 👈 allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v4

      # Step 2: Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      # Step 3: Install dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # Step 4: Build web into /docs folder
      - name: Build web into docs
        shell: bash   # 👈 Force bash
        run: |
          flutter build web --release --base-href /E-commerce-App-with-Backend/
          rm -rf docs
          mv build/web docs

      # Step 5: Commit and push updated /docs
      - name: Commit and push changes
        shell: bash   # 👈 also ensure bash here
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update docs with latest build" || echo "No changes to commit"
          git push
